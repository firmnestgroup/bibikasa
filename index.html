<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FAF8F4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kasa">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<title>Kasa · Bibi Brzozka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* Bibi design template — tokens */
:root{
  --kasa-paper:#FAF8F4;      /* page ground, warm white */
  --kasa-linen:#F3EFE8;      /* status strip, group rows */
  --kasa-white:#FFFDFA;      /* sheet, cards, tab bar */
  --kasa-stone:#E6E0D6;      /* hairline rules */
  --kasa-sand:#CFC5B6;       /* header rules, grabber */
  --kasa-ink:#172A3A;        /* text, totals (BIBI navy) */
  --kasa-ink-2:#4B5661;      /* secondary text */
  --kasa-ink-3:#6E7378;      /* labels, tags */
  --kasa-gilt:#7A6B47;       /* the one accent: links, selection */
  --kasa-gilt-wash:#EEE8DA;  /* selected cell / pressed */
  --kasa-clay:#8F4A43;       /* waiting on you (text) */
  --kasa-blush:#F6E7E0;      /* waiting on you (ground) */
  --kasa-scrim:rgba(23,42,58,.32);
  --font-display:"Cormorant Garamond",Georgia,serif;
  --font-ui:"Jost","Helvetica Neue",Helvetica,Arial,sans-serif;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:24px;--space-6:32px;--space-7:48px;
  --gutter:16px;--row:40px;--tabbar:56px;--rail:232px;--radius-sheet:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--kasa-paper);color:var(--kasa-ink);font-family:var(--font-ui);font-size:13.5px;line-height:18px;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{overflow-x:hidden}
a,.link{color:var(--kasa-gilt);text-decoration:none;cursor:pointer}
a:hover,.link:hover{text-decoration:underline;text-underline-offset:3px}
button,select,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;text-align:inherit}
.num,.k td,.k th{font-variant-numeric:tabular-nums lining-nums;font-feature-settings:"tnum" 1,"lnum" 1}
.eyebrow{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--kasa-ink-3);font-weight:500}
.ccy{font-size:10.5px;color:var(--kasa-ink-3);margin-left:4px;letter-spacing:.04em}
.muted{color:var(--kasa-ink-3)}
.note{font-size:11.5px;color:var(--kasa-ink-2);max-width:60ch;text-wrap:pretty}

/* shell */
.shell{min-height:100vh;min-height:100dvh}
.col{min-width:0;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;padding-bottom:calc(var(--tabbar) + env(safe-area-inset-bottom) + var(--sim-sab,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px var(--gutter) 12px;border-bottom:1px solid var(--kasa-stone);background:var(--kasa-paper)}
.mark{font-family:var(--font-display);font-size:22px;letter-spacing:.42em;font-weight:500;line-height:1;color:var(--kasa-ink)}
.mark-who{display:block;font-family:var(--font-ui);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--kasa-ink-3);margin-top:6px}
.top-ctx{display:none}
.btn-line{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--kasa-gilt);color:var(--kasa-gilt);padding:0 12px;height:36px;white-space:nowrap;font-weight:500}
.btn-line:hover{background:var(--kasa-gilt-wash)}
.btn-solid{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;background:var(--kasa-gilt);color:#FFFDFA;padding:0 18px;height:44px;font-weight:500;width:100%}
.btn-solid:hover{background:#6A5D3D}
.status{font-size:11.5px;color:var(--kasa-ink-2);padding:7px var(--gutter);background:var(--kasa-linen);border-bottom:1px solid var(--kasa-stone);letter-spacing:.01em}
main{flex:1;padding:24px var(--gutter) 32px;min-width:0}
footer.foot{padding:20px var(--gutter);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--kasa-ink-3);border-top:1px solid var(--kasa-stone);display:flex;justify-content:space-between;gap:12px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
h1{font-family:var(--font-ui);font-weight:500;font-size:18px;line-height:24px;margin-top:4px}
h2{font-family:var(--font-ui);font-size:10.5px;line-height:18px;letter-spacing:.18em;text-transform:uppercase;color:var(--kasa-ink-3);font-weight:500;margin:32px 0 8px}
.sec-sub{margin-bottom:14px}

/* tabs / rail */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:var(--kasa-white);border-top:1px solid var(--kasa-stone);padding-bottom:calc(env(safe-area-inset-bottom) + var(--sim-sab,0px))}
.tabs button{height:var(--tabbar);font-size:11.5px;color:var(--kasa-ink-2);position:relative;text-align:center;letter-spacing:.01em;display:flex;align-items:center;justify-content:center;gap:4px}
.tabs button[aria-current]{color:var(--kasa-ink);font-weight:500}
.tabs button[aria-current]::before{content:"";position:absolute;top:-1px;left:18%;right:18%;height:2px;background:var(--kasa-gilt)}
.badge{font-size:10.5px;color:var(--kasa-clay);background:var(--kasa-blush);border-radius:8px;padding:0 5px;line-height:15px;font-weight:500;font-variant-numeric:tabular-nums}
.tabs .badge{position:absolute;top:6px;right:4px}
.rail-mark{display:none}
@media (max-width:959px){.bal.mode-usd .c-nat{display:none}.bal.mode-native .c-mon{display:none}}

/* hero */

/* segmented */
.seg{display:inline-flex;border:1px solid var(--kasa-sand)}
.seg button{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;padding:0 12px;height:32px;color:var(--kasa-ink-2)}
.seg button+button{border-left:1px solid var(--kasa-sand)}
.seg button[aria-pressed="true"]{background:var(--kasa-gilt-wash);color:var(--kasa-ink);font-weight:500}

/* tables */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border-top:1px solid var(--kasa-sand);overscroll-behavior-x:contain}
table.k{border-collapse:separate;border-spacing:0;width:100%;font-size:13.5px;line-height:18px}
.k th{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--kasa-ink-3);font-weight:500;text-align:right;padding:10px 10px 9px;border-bottom:1px solid var(--kasa-sand);white-space:nowrap;background:var(--kasa-paper);vertical-align:bottom}
.k th small{display:block;font-size:inherit;letter-spacing:inherit;color:var(--kasa-gilt);text-transform:lowercase}
.k td{padding:0 10px;height:var(--row);border-bottom:1px solid var(--kasa-stone);text-align:right;white-space:nowrap;background:var(--kasa-paper)}
.k .l{text-align:left}
.k.sticky th:first-child,.k.sticky td:first-child{position:sticky;left:0;z-index:1;border-right:1px solid var(--kasa-stone)}
.k td.first{white-space:normal;min-width:140px;max-width:168px;line-height:18px;padding:5px 10px 5px 0;text-align:left}
.k th:first-child{padding-left:0;text-align:left}
.k td.tap{cursor:pointer}
.k td.tap:hover{color:var(--kasa-gilt);background:var(--kasa-gilt-wash)}
.k tr.grp td{height:32px;background:var(--kasa-linen);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--kasa-ink-2);font-weight:500}
.k tr.grp td.num{font-size:13.5px;letter-spacing:0;text-transform:none}
table.k.sticky tr.grp td[colspan]{position:sticky;left:0;text-align:left;padding-left:12px}
.k tr.sub td{font-weight:500}
.k tr.tot td{font-weight:500;border-top:1px solid var(--kasa-ink);border-bottom:1px solid var(--kasa-ink);height:var(--row)}
.k tr.rate td{color:var(--kasa-ink-2)}
.k td.wrap{white-space:normal;min-width:112px;max-width:150px;line-height:18px;padding-top:5px;padding-bottom:5px;text-align:left}
.k tr.row-tap{cursor:pointer}
.k tr.row-tap:hover td{background:var(--kasa-gilt-wash)}
.an{color:var(--kasa-ink);font-size:13.5px;text-align:left;line-height:18px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.an:hover{color:var(--kasa-gilt)}
.tag{display:block;font-size:11.5px;color:var(--kasa-ink-3);margin-top:2px;letter-spacing:.02em}
.d1{font-size:13.5px}
.d2{font-size:11.5px;color:var(--kasa-ink-3);margin-top:1px}
.wait{color:var(--kasa-clay)}

/* statements */
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--kasa-ink-2);margin-bottom:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sq{display:inline-block;width:7px;height:7px;border:1px solid var(--kasa-ink-2);flex:none}
.sq.fill{background:var(--kasa-ink-2)}
.k td.st{text-align:left;font-size:11.5px;min-width:96px;color:var(--kasa-ink-2)}
.st-in{display:flex;align-items:center;gap:6px}
.k td.st-miss{background:var(--kasa-blush);color:var(--kasa-clay);line-height:1.2;white-space:normal}
.st-miss b{display:block;font-weight:500}
.st-miss span{font-size:11.5px}
.ql{list-style:none;border-top:1px solid var(--kasa-sand)}
.ql li{padding:12px 0 14px;border-bottom:1px solid var(--kasa-stone)}
.qtop{display:flex;justify-content:space-between;gap:12px;font-size:11.5px;color:var(--kasa-ink-3)}
.qamt{font-size:13.5px;color:var(--kasa-ink)}
.qdesc{font-size:13.5px;margin:3px 0 10px}
.qact{display:flex;gap:8px}
.qact select{flex:1;min-width:0}
.btn-save{height:40px;padding:0 16px;border:1px solid var(--kasa-gilt);color:var(--kasa-gilt);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:500}
.btn-save:hover{background:var(--kasa-gilt-wash)}
.qdone{font-size:13.5px;color:var(--kasa-ink-2)}
select,.input{height:40px;border:1px solid var(--kasa-stone);background:var(--kasa-white);padding:0 10px;font-size:13.5px;border-radius:0;width:100%;min-width:0}
select:focus,.input:focus{outline:1px solid var(--kasa-gilt);outline-offset:-1px}

/* transactions */
.filters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:16px}
.filters label{display:flex;flex-direction:column;gap:4px;min-width:0}
.filters label span{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--kasa-ink-3);font-weight:500}
.filters .wide{grid-column:1/-1}
.resline{display:flex;justify-content:space-between;gap:12px;font-size:11.5px;color:var(--kasa-ink-2);margin-bottom:8px;flex-wrap:wrap}
.more{display:block;margin:16px auto 0;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--kasa-gilt);height:44px;padding:0 16px}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--kasa-scrim);opacity:0;pointer-events:none;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:680px;max-height:90vh;max-height:90dvh;background:var(--kasa-white);border-radius:var(--radius-sheet) var(--radius-sheet) 0 0;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:41;display:flex;flex-direction:column;box-shadow:0 -1px 0 var(--kasa-stone)}
.sheet.on{transform:none}
.sh-h{padding:8px var(--gutter) 12px;border-bottom:1px solid var(--kasa-stone);flex:none}
.grab{width:36px;height:4px;border-radius:2px;background:var(--kasa-sand);margin:0 auto 12px}
.sh-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sh-title{font-size:13.5px;font-weight:500;line-height:18px;margin-top:2px}
.sh-sub{font-size:11.5px;color:var(--kasa-ink-2);margin-top:3px}
.sh-x{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--kasa-gilt);height:32px;padding:0 2px;flex:none;font-weight:500}
.sh-b{overflow-y:auto;flex:1;padding:0 var(--gutter);min-height:120px;-webkit-overflow-scrolling:touch}
.sh-f{flex:none;border-top:1px solid var(--kasa-ink);padding:12px var(--gutter) calc(14px + env(safe-area-inset-bottom) + var(--sim-sab,0px));display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-weight:500}
.sh-f .muted{font-weight:400;font-size:11.5px}
.sh-search{margin-top:12px}
.dh{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;padding:10px 0 6px;border-bottom:1px solid var(--kasa-sand);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--kasa-ink-3);font-weight:500;position:sticky;top:0;background:var(--kasa-white)}
.dh span:last-child{text-align:right}
.dr{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:2px 12px;padding:8px 0;border-bottom:1px solid var(--kasa-stone);width:100%;min-height:var(--row)}
.dr:hover{background:var(--kasa-gilt-wash)}
.dr .dt{font-size:11.5px;color:var(--kasa-ink-2);padding-top:1px}
.dr .am{text-align:right;white-space:nowrap}
.am .n{font-size:13.5px}
.am .u{font-size:11.5px;color:var(--kasa-ink-3)}
.empty{padding:28px 0;color:var(--kasa-ink-2);font-size:13.5px;text-wrap:pretty}

/* detail card — a row of her Kasa sheet */
.kr-head{padding:16px 0 10px}
.kr-name{font-size:13.5px;font-weight:500;line-height:18px;margin-top:2px}
.kr-row{overflow-x:auto;border:1px solid var(--kasa-sand);margin-bottom:6px}
.kr-row table{border-collapse:collapse;font-size:11.5px;font-variant-numeric:tabular-nums lining-nums}
.kr-row th,.kr-row td{border-right:1px solid var(--kasa-stone);padding:6px 10px;text-align:right;white-space:nowrap}
.kr-row th{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--kasa-ink-3);font-weight:500;background:var(--kasa-linen);border-bottom:1px solid var(--kasa-stone)}
.kr-row th:first-child,.kr-row td:first-child{text-align:left;position:sticky;left:0;background:var(--kasa-linen);z-index:1;max-width:150px;white-space:normal}
.kr-row td:first-child{background:var(--kasa-white)}
.kr-row .hit{outline:2px solid var(--kasa-gilt);outline-offset:-2px;background:var(--kasa-gilt-wash);color:var(--kasa-ink);font-weight:500}
.kr-cap{font-size:11.5px;color:var(--kasa-ink-3);margin-bottom:14px}
.cells{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid var(--kasa-sand);border-left:1px solid var(--kasa-stone);margin-bottom:20px}
.cell{border-right:1px solid var(--kasa-stone);border-bottom:1px solid var(--kasa-stone);padding:9px 12px 10px;min-width:0}
.cell.w{grid-column:1/-1}
.cell .lb{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--kasa-ink-3);font-weight:500}
.cell .v{font-size:13.5px;line-height:18px;margin-top:3px;overflow-wrap:anywhere}
.cell .v.num{font-size:13.5px}
.cell .s{font-size:11.5px;color:var(--kasa-ink-3);margin-top:1px}
.cell.waiting{background:var(--kasa-blush)}
.cell.waiting .v{color:var(--kasa-clay)}
.cell.say .v{text-wrap:pretty}

/* accountant */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 16px}
.chip{height:34px;padding:0 12px;border:1px solid var(--kasa-sand);font-size:11.5px;color:var(--kasa-ink-2)}
.chip[aria-pressed="true"]{border-color:var(--kasa-gilt);background:var(--kasa-gilt-wash);color:var(--kasa-ink)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.two label{display:flex;flex-direction:column;gap:4px}
.two label span{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--kasa-ink-3);font-weight:500}
.acc-sum{margin:18px 0;border-top:1px solid var(--kasa-sand)}
.acc-sum div{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--kasa-stone);font-size:13.5px}

/* PIN */
.pin{position:fixed;inset:0;z-index:60;background:var(--kasa-paper);display:flex;align-items:center;justify-content:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom))}
.pin-in{width:100%;max-width:320px;text-align:center}
.pin .mark{font-size:34px;letter-spacing:.5em;margin-right:-.5em}
.pin-msg{font-size:13.5px;line-height:18px;margin:40px 0 18px}
.dots{display:flex;justify-content:center;gap:18px;margin-bottom:12px}
.dots i{width:11px;height:11px;border-radius:50%;border:1px solid var(--kasa-ink)}
.dots i.on{background:var(--kasa-ink)}
.pin-err{height:20px;font-size:13px;color:var(--kasa-clay)}
.pad{display:grid;grid-template-columns:repeat(3,72px);justify-content:center;gap:14px 28px;margin-top:18px}
.pad button{width:72px;height:72px;border-radius:50%;border:1px solid var(--kasa-stone);font-size:24px;font-weight:300;text-align:center;font-variant-numeric:tabular-nums}
.pad button:hover{background:var(--kasa-linen)}
.pad button.txt{border:0;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--kasa-ink-2);font-weight:400}
.pin-note{font-size:11.5px;color:var(--kasa-ink-3);margin-top:28px}

/* desktop */
@media (min-width:960px){
  .shell{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);max-width:1360px;margin:0 auto}
  .tabs{position:sticky;top:0;align-self:start;height:100vh;height:100dvh;padding-bottom:0;display:flex;flex-direction:column;border-top:0;border-right:1px solid var(--kasa-stone);background:var(--kasa-paper);padding:30px 0 0}
  .tabs button{height:44px;justify-content:space-between;padding:0 28px;font-size:14px;text-align:left}
  .tabs button[aria-current]{background:var(--kasa-linen)}
  .tabs button[aria-current]::before{top:0;bottom:0;left:0;right:auto;width:2px;height:auto}
  .tabs .badge{position:static}
  .rail-mark{display:block;padding:0 28px 34px}
  .col{padding-bottom:0}
  .top{padding:16px 40px}
  .top .brand{display:none}
  .top-ctx{display:block;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--kasa-ink-3)}
  .status{padding:8px 40px}
  main{padding:36px 40px 48px}
  footer.foot{padding:20px 40px 28px}
  .filters{grid-template-columns:repeat(3,minmax(0,1fr)) minmax(0,1.4fr)}
  .filters .wide{grid-column:auto}
  .k td.first{min-width:220px;max-width:260px}
  .sheet{bottom:0}
}

/* investments */
.pos{color:var(--kasa-ink)}.neg{color:var(--kasa-clay)}
.k.inv td.spk,.k.inv th.spk{width:76px;min-width:76px;padding-right:0}
.sp{width:60px;height:18px;display:block;margin-left:auto}
.sp path{fill:none;stroke:var(--kasa-ink-2);stroke-width:1.25;stroke-linejoin:round;stroke-linecap:round}
.ch-read{display:flex;flex-wrap:wrap;gap:4px 18px;align-items:baseline;font-size:12.5px;color:var(--kasa-ink-2);margin:0 0 10px;min-height:20px}
.ch-read b{font-weight:500;color:var(--kasa-ink)}
.ch-read span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.ch-read .pos{color:var(--kasa-ink);font-weight:500}.ch-read .neg{color:var(--kasa-clay);font-weight:500}
.key{display:inline-block;width:14px;height:0;border-top:2px solid var(--kasa-ink);flex:none}
.key.k-base{border-top:1.5px dashed var(--kasa-ink-3)}
.ch{position:relative;height:220px;padding:0 14px 24px 48px;border-top:1px solid var(--kasa-sand);border-bottom:1px solid var(--kasa-stone)}
.ch-y{position:absolute;left:0;right:0;top:12px;bottom:36px;pointer-events:none}
.ch-t{position:absolute;left:0;right:0;border-top:1px solid var(--kasa-stone);height:0}
.ch-t span{position:absolute;left:0;top:-8px;font-size:10.5px;color:var(--kasa-ink-3);background:var(--kasa-paper);padding-right:6px;font-variant-numeric:tabular-nums}
.ch-plot{position:absolute;left:48px;right:14px;top:12px;bottom:36px}

function load(){
  var cached=null;try{cached=JSON.parse(localStorage.getItem(CONFIG.cacheKey)||'null')}catch(e){}

}
function prepare(data){
  D=data;ACC={};TXBY={};

    D.statements=(D.statements||[]).filter(function(x){return !dup[x.accountId]});
  }
  D.accounts.forEach(function(a){ACC[a.id]=a});
  var ms={};D.accounts.forEach(function(a){Object.keys(a.balances||{}).forEach(function(k){ms[k]=1})});
  MONTHS=Object.keys(ms).sort();

}
function applyAnswer(q,ans,persist){
  var t=TXBY[q.txId];if(!t)return;
  q.answer=ans;

  else{
    q.status='answered';
    var map={};ANSWERS.forEach(function(a){map[a[0]]=a[1]});
    t.scope=map[ans]||'question';
    t.category=ans==='Business income'?'Other income':ans==='Business cost'?'Other costs':t._cat0;
  }
  if(persist&&!DEMO){
    var saved={};try{saved=JSON.parse(localStorage.getItem(CONFIG.answersKey)||'{}')}catch(e){}
    if(ans==null)delete saved[q.txId];else saved[q.txId]=ans;
    localStorage.setItem(CONFIG.answersKey,JSON.stringify(saved));
  }
}

/* ---------- Investments ---------- */
var INV_FEED=[{re:/gbm/i,code:'640'}];   /* money moved into a holding that Kasa only knows by its month-end value */
function invData(){
  var hs=D.accounts.filter(function(a){return a.group!=='Cash'});
  var rows=hs.map(function(a){
    var ks=MONTHS.filter(function(m){return bal(a,m)!=null});
    if(!ks.length)return null;
    var k0=ks[0],k1=ks[ks.length-1],r=fx(a.ccy),v0=bal(a,k0),v1=bal(a,k1);
    var flows=[],known=false;
    if(a.source==='xero'){known=true;flows=TX.filter(function(t){return t.accountId===a.id&&t.code!=='270'&&t.code!=='275'}).map(function(t){return {m:t._m,v:t.amount,t:t}})}
    else if(a.added&&Object.keys(a.added).length){known=true;Object.keys(a.added).forEach(function(m){if(a.added[m])flows.push({m:m,v:+a.added[m],t:null})})}
    else INV_FEED.forEach(function(f){if(f.re.test(a.kasaName)){known=true;TX.forEach(function(t){if(t.code===f.code)flows.push({m:t._m,v:-t.amount*fx(t.ccy)/(r||1),t:t})})}});
    flows=flows.filter(function(f){return f.m>k0&&f.m<=k1});
    var added=flows.reduce(function(x,f){return x+f.v},0);
    var growth=v1-v0-added,base=v0+added;
    var flat=ks.every(function(m){return bal(a,m)===v0});
    var still=flat&&!flows.length;                       /* held at cost: nothing to measure */
    if(still)known=true;
    var val=MONTHS.map(function(m){var last=null;ks.forEach(function(k){if(k<=m)last=bal(a,k)});return (last||0)*r});
    var cum=MONTHS.map(function(m){return flows.reduce(function(x,f){return x+(f.m<=m?f.v:0)},0)*r});
    return {a:a,k0:k0,k1:k1,v0:v0*r,v1:v1*r,change:(v1-v0)*r,chgPct:v0>0?(v1-v0)/v0*100:null,added:added*r,growth:growth*r,pct:base>0?growth/base*100:null,
      still:still,known:known,empty:!v0&&!v1,hasFlow:flows.length>0,flowTx:flows.map(function(f){return f.t}).filter(Boolean),val:val,cum:cum};
  }).filter(Boolean);
  var tot=function(l){var o={v0:0,v1:0,change:0,added:0,growth:0,allKnown:true,val:MONTHS.map(function(){return 0}),cum:MONTHS.map(function(){return 0})};
    l.forEach(function(x){o.v0+=x.v0;o.v1+=x.v1;o.change+=x.change;if(!x.known)o.allKnown=false;else{o.added+=x.added;o.growth+=x.growth}x.val.forEach(function(v,i){o.val[i]+=v});x.cum.forEach(function(v,i){if(x.known)o.cum[i]+=v})});
    o.pct=(o.allKnown&&(o.v0+o.added)>0)?o.growth/(o.v0+o.added)*100:null;return o};
  return {rows:rows,tot:tot,all:tot(rows)};
}
function fPct1(n){if(n==null||!isFinite(n))return '–';var r=Math.round(n*10)/10;if(r===0)return '0.0%';var b=Math.abs(r).toFixed(1)+'%';return r<0?'('+b+')':'+'+b}
function fSign(n){var r=Math.round(n);if(!r)return '–';return r<0?fUSD(r):'+'+fUSD(r)}
function fM(n){var a=Math.abs(n);return a>=1e6?(n/1e6).toFixed(2)+'m':a>=1e3?Math.round(n/1e3)+'k':String(Math.round(n))}
function invReadout(I,i){
  var m=MONTHS[i],v=I.all.val[i],b=I.all.v0+I.all.cum[i],g=v-b;
  return '<b>'+mEnd(m)+'</b><span><i class="key k-val"></i>Value '+fUSD(v,{dollar:true})+'</span><span><i class="key k-base"></i>January value plus money added '+(I.all.allKnown?'':'so far ')+fUSD(b,{dollar:true})+'</span><span class="'+(g<0?'neg':'pos')+'">'+(I.all.allKnown?'Growth ':'Difference ')+fSign(g)+'</span>';
}
var INV=null;

        (x.still||!x.known?dash+dash:cell(x,fSign(x.growth),gcls(x.growth))+cell(x,fPct1(x.pct),gcls(x.growth)))+

  var A=I.all;

  /* chart 1: value against January value plus money added */
  var base=A.cum.map(function(c){return A.v0+c});
  var lo=Math.min.apply(null,A.val.concat(base)),hi=Math.max.apply(null,A.val.concat(base)),pad=(hi-lo)*0.12||1;lo-=pad;hi+=pad;
  var X=function(i){return n>1?i/(n-1)*100:50},Y=function(v){return 100-(v-lo)/(hi-lo)*100};
  var path=function(arr){return arr.map(function(v,i){return (i?'L':'M')+X(i).toFixed(2)+' '+Y(v).toFixed(2)}).join(' ')};
  var gap='M'+A.val.map(function(v,i){return X(i).toFixed(2)+' '+Y(v).toFixed(2)}).join(' L')+' L'+base.slice().reverse().map(function(v,j){var i=n-1-j;return X(i).toFixed(2)+' '+Y(v).toFixed(2)}).join(' L')+' Z';
  var ticks=[0,1,2].map(function(k){var v=lo+pad+(hi-lo-2*pad)*k/2;return '<div class="ch-t" style="top:'+Y(v).toFixed(2)+'%"><span>$'+fM(v)+'</span></div>'}).join('');
  var hits=MONTHS.map(function(m,i){return '<button class="ch-hit'+(i===n-1?' on':'')+'" data-inv="'+i+'" style="left:'+X(i).toFixed(2)+'%" aria-label="'+mLong(m)+'"><i style="top:'+Y(A.val[i]).toFixed(2)+'%"></i></button>'}).join('');
  var xl=MONTHS.map(function(m,i){return '<span style="left:'+X(i).toFixed(2)+'%">'+mLabel(m)+'</span>'}).join('');
  var chart='<div class="ch-read" id="inv-read">'+invReadout(I,n-1)+'</div>'+
    '<div class="ch"><div class="ch-y">'+ticks+'</div><div class="ch-plot">'+
    '<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path class="c-gap" d="'+gap+'"/><path class="c-base" d="'+path(base)+'"/><path class="c-val" d="'+path(A.val)+'"/></svg>'+hits+'</div><div class="ch-x">'+xl+'</div></div>';
  /* chart 2: growth by holding */
  var gl=I.rows.filter(function(x){return !x.still&&!x.empty}).map(function(x){return {x:x,p:x.known?x.pct:x.chgPct,v:x.known?x.growth:x.change}}).filter(function(o){return o.p!=null}).sort(function(a,b){return b.p-a.p});
  var mx=Math.max.apply(null,gl.map(function(o){return Math.abs(o.p)}).concat([1]));

  var gkey='<div class="ch-read"><span><i class="key k-bar"></i>Growth, money added taken out</span>'+(anyUnk?'<span><i class="key k-bar unk"></i>Change in value, money added not given yet</span>':'')+'</div>';

function csv(rows){return rows.map(function(r){return r.map(function(v){var s=v==null?'':String(v);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}).join(',')}).join('\r\n')}
function save(name,text){var b=new Blob(['\ufeff'+text],{type:'text/csv;charset=utf-8'});var u=URL.createObjectURL(b);var l=document.createElement('a');l.href=u;l.download=name;document.body.appendChild(l);l.click();l.remove();setTimeout(function(){URL.revokeObjectURL(u)},2000)}
function download(){
  var a=S.ap,ms=MONTHS.filter(function(m){return inRange(m,a.from,a.to)}),P=plData();
  var r2=function(n){return Math.round(n*100)/100};
  var rows=[['Line'].concat(ms.map(mLong),['Total'])];
  var line=function(n,l){rows.push([n].concat(ms.map(function(m){return r2(sumUSD(l.filter(function(t){return t._m===m})))}),[r2(sumUSD(l.filter(function(t){return inRange(t._m,a.from,a.to)})))]))};
  var inc=[],cost=[];
  rows.push(['Income']);P.inc.forEach(function(n){inc=inc.concat(P.cats[n]);line(n,P.cats[n])});line('Total income',inc);
  rows.push(['Costs']);P.cost.forEach(function(n){cost=cost.concat(P.cats[n]);line(n,P.cats[n])});line('Total costs',cost);
  line('Net profit',P.biz);
  var tag=a.from+'_'+a.to;
  save('kasa-pl-'+tag+'.csv',csv(rows));
  var tr=[['id','date','month','account_id','kasa_name','ccy','amount','usd','fx_rate','scope','category','code','contact','description','transfer_to','balance_after']];
  TX.filter(function(t){return inRange(t._m,a.from,a.to)}).forEach(function(t){tr.push([t.id,t.date,t._m,t.accountId,ACC[t.accountId].kasaName,t.ccy,t.amount,t.usd,t.rate,t.scope,t.category,t.code,t.contact,t.description,t.transferTo?ACC[t.transferTo].kasaName:'',t.balanceAfter])});
  setTimeout(function(){save('kasa-transactions-'+tag+'.csv',csv(tr))},400);
}

function showPin(){

    el.innerHTML='<div class="pin" role="dialog" aria-label="Enter PIN"><div class="pin-in"><div class="mark">KASA</div><span class="mark-who" style="margin-top:12px">Bibi Brzozka</span>'+
      '<div class="pin-msg">Enter your PIN</div><div class="dots">'+[0,1,2,3].map(function(i){return '<i class="'+(i<entered.length?'on':'')+'"></i>'}).join('')+'</div>'+
      '<div class="pin-err" role="alert">'+(err||'')+'</div><div class="pad">'+[1,2,3,4,5,6,7,8,9].map(function(n){return '<button data-k="'+n+'">'+n+'</button>'}).join('')+

  };

      if(entered===CONFIG.pin){if(!DEMO)localStorage.setItem(CONFIG.deviceKey,'ok');el.innerHTML='';document.removeEventListener('keydown',kd)}
      else{entered='';draw('That PIN didn’t match. Try again.')}
    },120);
  };
  var kd=function(e){if(/^[0-9]$/.test(e.key))press(e.key);else if(e.key==='Backspace')press('del')};
  el.onclick=function(e){var b=e.target.closest('[data-k]');if(b)press(b.dataset.k)};
  document.addEventListener('keydown',kd);
  draw();
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-d],[data-tx],[data-nav],[data-act]');if(!t)return;
  if(t.dataset.d!=null){REG[+t.dataset.d]&&REG[+t.dataset.d]();return}
  if(t.dataset.tx){var inSheet=!!t.closest('#sheet');if(inSheet&&topView()){S.stack.push({type:'tx',id:t.dataset.tx});renderSheet();$('#sheet .sh-b')&&($('#sheet .sh-b').scrollTop=0)}else{S.stack=[{type:'tx',id:t.dataset.tx}];openSheet()}return}
  if(t.dataset.nav){go(t.dataset.nav);return}
  var act=t.dataset.act;
  if(act==='close')closeSheet();
  else if(act==='back'){S.stack.pop();renderSheet()}
  else if(act==='mode'){S.mode=t.dataset.v;render()}
  else if(act==='more'){S.lim+=150;renderTxRes()}
  else if(act==='accountant'){S.stack=[{type:'accountant'}];openSheet()}
  else if(act==='preset'){var p=presets()[+t.dataset.i];S.ap.from=p[1];S.ap.to=p[2];renderSheet()}
  else if(act==='download')download();
  else if(act==='toq'){closeSheet();go('statements')}
  else if(act==='saveq'){
    var sel=document.querySelector('select[data-q="'+t.dataset.id+'"]');
    if(!sel||!sel.value){sel&&sel.focus();return}
    var q=D.questions.filter(function(x){return x.txId===t.dataset.id})[0];applyAnswer(q,sel.value,true);render();
  }
  else if(act==='undoq'){var q2=D.questions.filter(function(x){return x.txId===t.dataset.id})[0];applyAnswer(q2,null,true);render()}
});
document.addEventListener('change',function(e){
  var el=e.target;
  if(el.dataset.f&&el.dataset.f!=='q'){S.f[el.dataset.f]=el.value;S.lim=150;renderTxRes()}
  if(el.dataset.ap){S.ap[el.dataset.ap]=el.value;renderSheet()}
});
document.addEventListener('input',function(e){
  var el=e.target;
  if(el.dataset.f==='q'){S.f.q=el.value;S.lim=150;renderTxRes()}
  if(el.id==='sh-q'){topView().q=el.value;renderDrillList()}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&S.stack.length)closeSheet()});
window.addEventListener('hashchange',function(){var h=location.hash.slice(1);if(h&&h!==S.page&&PAGES.some(function(p){return p[0]===h}))go(h)});

/* ---------- boot ---------- */
load().then(function(data){
  prepare(data);
  var p=Q.get('page')||location.hash.slice(1);
  if(PAGES.some(function(x){return x[0]===p}))S.page=p;
  if(Q.get('acc'))S.f.acc=Q.get('acc');
  if(Q.get('month'))S.f.month=Q.get('month');
  if(Q.get('months')==='native')S.mode='native';
  render();
  var o=Q.get('open');
  if(o==='detail'||o==='drilldetail'){
    var t=TX.filter(function(x){return x.category==='Unitube remuneration'&&x._m===BM})[0]||TX[0];
    if(o==='drilldetail'){var l=TX.filter(function(x){return x.accountId===t.accountId&&x._m===BM});S.stack=[{type:'drill',title:ACC[t.accountId].kasaName,sub:mLong(BM),list:l,q:'',opts:{}},{type:'tx',id:t.id}]}
    else S.stack=[{type:'tx',id:t.id}];
    openSheet();
  }else if(o==='drill'){
    drill('Total income',mLong(BM)+' · US LLC',TX.filter(function(x){return x.scope==='business'&&x.amount>0&&x._m===BM}));
  }else if(o==='accountant'){S.stack=[{type:'accountant'}];openSheet()}
  if(Q.get('pin')==='1'||(!DEMO&&localStorage.getItem(CONFIG.deviceKey)!=='ok'))showPin();
});
})();
</script>
</body>
</html>
