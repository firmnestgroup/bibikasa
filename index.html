<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FAF8F4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kasa">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<title>Kasa · Bibi Brzozka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* Bibi design template — tokens */
:root{
  --kasa-paper:#FAF8F4;      /* page ground, warm white */
  --kasa-linen:#F3EFE8;      /* status strip, group rows */
  --kasa-white:#FFFDFA;      /* sheet, cards, tab bar */
  --kasa-stone:#E6E0D6;      /* hairline rules */
  --kasa-sand:#CFC5B6;       /* header rules, grabber */
  --kasa-ink:#172A3A;        /* text, totals (BIBI navy) */
  --kasa-ink-2:#4B5661;      /* secondary text */
  --kasa-ink-3:#6E7378;      /* labels, tags */
  --kasa-gilt:#7A6B47;       /* the one accent: links, selection */
  --kasa-gilt-wash:#EEE8DA;  /* selected cell / pressed */
  --kasa-clay:#8F4A43;       /* waiting on you (text) */
  --kasa-blush:#F6E7E0;      /* waiting on you (ground) */
  --kasa-scrim:rgba(23,42,58,.32);
  --font-display:"Cormorant Garamond",Georgia,serif;
  --font-ui:"Jost","Helvetica Neue",Helvetica,Arial,sans-serif;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:24px;--space-6:32px;--space-7:48px;
  --gutter:16px;--row:40px;--tabbar:56px;--rail:232px;--radius-sheet:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--kasa-paper);color:var(--kasa-ink);font-family:var(--font-ui);font-size:13.5px;line-height:18px;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{overflow-x:hidden}
a,.link{color:var(--kasa-gilt);text-decoration:none;cursor:pointer}
a:hover,.link:hover{text-decoration:underline;text-underline-offset:3px}
button,select,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;text-align:inherit}
.num,.k td,.k th{font-variant-numeric:tabular-nums lining-nums;font-feature-settings:"tnum" 1,"lnum" 1}
.eyebrow{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--kasa-ink-3);font-weight:500}
.ccy{font-size:10.5px;color:var(--kasa-ink-3);margin-left:4px;letter-spacing:.04em}
.muted{color:var(--kasa-ink-3)}
.note{font-size:11.5px;color:var(--kasa-ink-2);max-width:60ch;text-wrap:pretty}

/* shell */
.shell{min-height:100vh;min-height:100dvh}
.col{min-width:0;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;padding-bottom:calc(var(--tabbar) + env(safe-area-inset-bottom) + var(--sim-sab,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px var(--gutter) 12px;border-bottom:1px solid var(--kasa-stone);background:var(--kasa-paper)}
.mark{font-family:var(--font-display);font-size:22px;letter-spacing:.42em;font-weight:500;line-height:1;color:var(--kasa-ink)}
.mark-who{display:block;font-family:var(--font-ui);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--kasa-ink-3);margin-top:6px}
.top-ctx{display:none}
.btn-line{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--kasa-gilt);color:var(--kasa-gilt);padding:0 12px;height:36px;white-space:nowrap;font-weight:500}
.btn-line:hover{background:var(--kasa-gilt-wash)}
.btn-solid{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;background:var(--kasa-gilt);color:#FFFDFA;padding:0 18px;height:44px;font-weight:500;width:100%}
.btn-solid:hover{background:#6A5D3D}
.status{font-size:11.5px;color:var(--kasa-ink-2);padding:7px var(--gutter);background:var(--kasa-linen);border-bottom:1px solid var(--kasa-stone);letter-spacing:.01em}
main{flex:1;padding:24px var(--gutter) 32px;min-width:0}
footer.foot{padding:20px var(--gutter);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--kasa-ink-3);border-top:1px solid var(--kasa-stone);display:flex;justify-content:space-between;gap:12px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
h1{font-family:var(--font-ui);font-weight:500;font-size:18px;line-height:24px;margin-top:4px}
h2{font-family:var(--font-ui);font-size:10.5px;line-height:18px;letter-spacing:.18em;text-transform:uppercase;color:var(--kasa-ink-3);font-weight:500;margin:32px 0 8px}
.sec-sub{margin-bottom:14px}

/* tabs / rail */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:var(--kasa-white);border-top:1px solid var(--kasa-stone);padding-bottom:calc(env(safe-area-inset-bottom) + var(--sim-sab,0px))}
.tabs button{height:var(--tabbar);font-size:11.5px;color:var(--kasa-ink-2);position:relative;text-align:center;letter-spacing:.01em;display:flex;align-items:center;justify-content:center;gap:4px}
.tabs button[aria-current]{color:var(--kasa-ink);font-weight:500}
.tabs button[aria-current]::before{content:"";position:absolute;top:-1px;left:18%;right:18%;height:2px;background:var(--kasa-gilt)}
.badge{font-size:10.5px;color:var(--kasa-clay);background:var(--kasa-blush);border-radius:8px;padding:0 5px;line-height:15px;font-weight:500;font-variant-numeric:tabular-nums}
.tabs .badge{position:absolute;top:6px;right:4px}
.rail-mark{display:none}
@media (max-width:959px){.bal.mode-usd .c-nat{display:none}.bal.mode-native .c-mon{display:none}}

/* hero */

/* segmented */
.seg{display:inline-flex;border:1px solid var(--kasa-sand)}
.seg button{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;padding:0 12px;height:32px;color:var(--kasa-ink-2)}
.seg button+button{border-left:1px solid var(--kasa-sand)}
.seg button[aria-pressed="true"]{background:var(--kasa-gilt-wash);color:var(--kasa-ink);font-weight:500}

/* tables */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border-top:1px solid var(--kasa-sand);overscroll-behavior-x:contain}
table.k{border-collapse:separate;border-spacing:0;width:100%;font-size:13.5px;line-height:18px}
.k th{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--kasa-ink-3);font-weight:500;text-align:right;padding:10px 10px 9px;border-bottom:1px solid var(--kasa-sand);white-space:nowrap;background:var(--kasa-paper);vertical-align:bottom}
.k th small{display:block;font-size:inherit;letter-spacing:inherit;color:var(--kasa-gilt);text-transform:lowercase}
.k td{padding:0 10px;height:var(--row);border-bottom:1px solid var(--kasa-stone);text-align:right;white-space:nowrap;background:var(--kasa-paper)}
.k .l{text-align:left}
.k.sticky th:first-child,.k.sticky td:first-child{position:sticky;left:0;z-index:1;border-right:1px solid var(--kasa-stone)}
.k td.first{white-space:normal;min-width:140px;max-width:168px;line-height:18px;padding:5px 10px 5px 0;text-align:left}
.k th:first-child{padding-left:0;text-align:left}
.k td.tap{cursor:pointer}
.k td.tap:hover{color:var(--kasa-gilt);background:var(--kasa-gilt-wash)}
.k tr.grp td{height:32px;background:var(--kasa-linen);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--kasa-ink-2);font-weight:500}
.k tr.grp td.num{font-size:13.5px;letter-spacing:0;text-transform:none}
table.k.sticky tr.grp td[colspan]{position:sticky;left:0;text-align:left;padding-left:12px}
.k tr.sub td{font-weight:500}
.k tr.tot td{font-weight:500;border-top:1px solid var(--kasa-ink);border-bottom:1px solid var(--kasa-ink);height:var(--row)}
.k tr.rate td{color:var(--kasa-ink-2)}
.k td.wrap{white-space:normal;min-width:112px;max-width:150px;line-height:18px;padding-top:5px;padding-bottom:5px;text-align:left}
.k tr.row-tap{cursor:pointer}
.k tr.row-tap:hover td{background:var(--kasa-gilt-wash)}
.an{color:var(--kasa-ink);font-size:13.5px;text-align:left;line-height:18px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.an:hover{color:var(--kasa-gilt)}
.tag{display:block;font-size:11.5px;color:var(--kasa-ink-3);margin-top:2px;letter-spacing:.02em}
.d1{font-size:13.5px}
.d2{font-size:11.5px;color:var(--kasa-ink-3);margin-top:1px}
.wait{color:var(--kasa-clay)}

/* statements */
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--kasa-ink-2);margin-bottom:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sq{display:inline-block;width:7px;height:7px;border:1px solid var(--kasa-ink-2);flex:none}
.sq.fill{background:var(--kasa-ink-2)}
.k td.st{text-align:left;font-size:11.5px;min-width:96px;color:var(--kasa-ink-2)}
.st-in{display:flex;align-items:center;gap:6px}
.k td.st-miss{background:var(--kasa-blush);color:var(--kasa-clay);line-height:1.2;white-space:normal}
.st-miss b{display:block;font-weight:500}
.st-miss span{font-size:11.5px}
.ql{list-style:none;border-top:1px solid var(--kasa-sand)}
.ql li{padding:12px 0 14px;border-bottom:1px solid var(--kasa-stone)}
.qtop{display:flex;justify-content:space-between;gap:12px;font-size:11.5px;color:var(--kasa-ink-3)}
.qamt{font-size:13.5px;color:var(--kasa-ink)}
.qdesc{font-size:13.5px;margin:3px 0 10px}
.qact{display:flex;gap:8px}
.qact select{flex:1;min-width:0}
.btn-save{height:40px;padding:0 16px;border:1px solid var(--kasa-gilt);color:var(--kasa-gilt);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:500}
.btn-save:hover{background:var(--kasa-gilt-wash)}
.qdone{font-size:13.5px;color:var(--kasa-ink-2)}
select,.input{height:40px;border:1px solid var(--kasa-stone);background:var(--kasa-white);padding:0 10px;font-size:13.5px;border-radius:0;width:100%;min-width:0}
select:focus,.input:focus{outline:1px solid var(--kasa-gilt);outline-offset:-1px}

/* transactions */
.filters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:16px}
.filters label{display:flex;flex-direction:column;gap:4px;min-width:0}
.filters label span{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--kasa-ink-3);font-weight:500}
.filters .wide{grid-column:1/-1}
.resline{display:flex;justify-content:space-between;gap:12px;font-size:11.5px;color:var(--kasa-ink-2);margin-bottom:8px;flex-wrap:wrap}
.more{display:block;margin:16px auto 0;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--kasa-gilt);height:44px;padding:0 16px}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--kasa-scrim);opacity:0;pointer-events:none;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:680px;max-height:90vh;max-height:90dvh;background:var(--kasa-white);border-radius:var(--radius-sheet) var(--radius-sheet) 0 0;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:41;display:flex;flex-direction:column;box-shadow:0 -1px 0 var(--kasa-stone)}
.sheet.on{transform:none}
.sh-h{padding:8px var(--gutter) 12px;border-bottom:1px solid var(--kasa-stone);flex:none}
.grab{width:36px;height:4px;border-radius:2px;background:var(--kasa-sand);margin:0 auto 12px}
.sh-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sh-title{font-size:13.5px;font-weight:500;line-height:18px;margin-top:2px}
.sh-sub{font-size:11.5px;color:var(--kasa-ink-2);margin-top:3px}
.sh-x{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--kasa-gilt);height:32px;padding:0 2px;flex:none;font-weight:500}
.sh-b{overflow-y:auto;flex:1;padding:0 var(--gutter);min-height:120px;-webkit-overflow-scrolling:touch}
.sh-f{flex:none;border-top:1px solid var(--kasa-ink);padding:12px var(--gutter) calc(14px + env(safe-area-inset-bottom) + var(--sim-sab,0px));display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-weight:500}
.sh-f .muted{font-weight:400;font-size:11.5px}
.sh-search{margin-top:12px}
.dh{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;padding:10px 0 6px;border-bottom:1px solid var(--kasa-sand);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--kasa-ink-3);font-weight:500;position:sticky;top:0;background:var(--kasa-white)}
.dh span:last-child{text-align:right}
.dr{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:2px 12px;padding:8px 0;border-bottom:1px solid var(--kasa-stone);width:100%;min-height:var(--row)}
.dr:hover{background:var(--kasa-gilt-wash)}
.dr .dt{font-size:11.5px;color:var(--kasa-ink-2);padding-top:1px}
.dr .am{text-align:right;white-space:nowrap}
.am .n{font-size:13.5px}
.am .u{font-size:11.5px;color:var(--kasa-ink-3)}
.empty{padding:28px 0;color:var(--kasa-ink-2);font-size:13.5px;text-wrap:pretty}

/* detail card — a row of her Kasa sheet */
.kr-head{padding:16px 0 10px}
.kr-name{font-size:13.5px;font-weight:500;line-height:18px;margin-top:2px}
.kr-row{overflow-x:auto;border:1px solid var(--kasa-sand);margin-bottom:6px}
.kr-row table{border-collapse:collapse;font-size:11.5px;font-variant-numeric:tabular-nums lining-nums}
.kr-row th,.kr-row td{border-right:1px solid var(--kasa-stone);padding:6px 10px;text-align:right;white-space:nowrap}
.kr-row th{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--kasa-ink-3);font-weight:500;background:var(--kasa-linen);border-bottom:1px solid var(--kasa-stone)}
.kr-row th:first-child,.kr-row td:first-child{text-align:left;position:sticky;left:0;background:var(--kasa-linen);z-index:1;max-width:150px;white-space:normal}
.kr-row td:first-child{background:var(--kasa-white)}
.kr-row .hit{outline:2px solid var(--kasa-gilt);outline-offset:-2px;background:var(--kasa-gilt-wash);color:var(--kasa-ink);font-weight:500}
.kr-cap{font-size:11.5px;color:var(--kasa-ink-3);margin-bottom:14px}
.cells{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid var(--kasa-sand);border-left:1px solid var(--kasa-stone);margin-bottom:20px}
.cell{border-right:1px solid var(--kasa-stone);border-bottom:1px solid var(--kasa-stone);padding:9px 12px 10px;min-width:0}
.cell.w{grid-column:1/-1}
.cell .lb{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--kasa-ink-3);font-weight:500}
.cell .v{font-size:13.5px;line-height:18px;margin-top:3px;overflow-wrap:anywhere}
.cell .v.num{font-size:13.5px}
.cell .s{font-size:11.5px;color:var(--kasa-ink-3);margin-top:1px}
.cell.waiting{background:var(--kasa-blush)}
.cell.waiting .v{color:var(--kasa-clay)}
.cell.say .v{text-wrap:pretty}

/* accountant */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 16px}
.chip{height:34px;padding:0 12px;border:1px solid var(--kasa-sand);font-size:11.5px;color:var(--kasa-ink-2)}
.chip[aria-pressed="true"]{border-color:var(--kasa-gilt);background:var(--kasa-gilt-wash);color:var(--kasa-ink)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.two label{display:flex;flex-direction:column;gap:4px}
.two label span{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--kasa-ink-3);font-weight:500}
.acc-sum{margin:18px 0;border-top:1px solid var(--kasa-sand)}
.acc-sum div{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--kasa-stone);font-size:13.5px}

/* PIN */
.pin{position:fixed;inset:0;z-index:60;background:var(--kasa-paper);display:flex;align-items:center;justify-content:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom))}
.pin-in{width:100%;max-width:320px;text-align:center}
.pin .mark{font-size:34px;letter-spacing:.5em;margin-right:-.5em}
.pin-msg{font-size:13.5px;line-height:18px;margin:40px 0 18px}
.dots{display:flex;justify-content:center;gap:18px;margin-bottom:12px}
.dots i{width:11px;height:11px;border-radius:50%;border:1px solid var(--kasa-ink)}
.dots i.on{background:var(--kasa-ink)}
.pin-err{height:20px;font-size:13px;color:var(--kasa-clay)}
.pad{display:grid;grid-template-columns:repeat(3,72px);justify-content:center;gap:14px 28px;margin-top:18px}
.pad button{width:72px;height:72px;border-radius:50%;border:1px solid var(--kasa-stone);font-size:24px;font-weight:300;text-align:center;font-variant-numeric:tabular-nums}
.pad button:hover{background:var(--kasa-linen)}
.pad button.txt{border:0;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--kasa-ink-2);font-weight:400}
.pin-note{font-size:11.5px;color:var(--kasa-ink-3);margin-top:28px}

/* desktop */
@media (min-width:960px){
  .shell{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);max-width:1360px;margin:0 auto}
  .tabs{position:sticky;top:0;align-self:start;height:100vh;height:100dvh;padding-bottom:0;display:flex;flex-direction:column;border-top:0;border-right:1px solid var(--kasa-stone);background:var(--kasa-paper);padding:30px 0 0}
  .tabs button{height:44px;justify-content:space-between;padding:0 28px;font-size:14px;text-align:left}
  .tabs button[aria-current]{background:var(--kasa-linen)}
  .tabs button[aria-current]::before{top:0;bottom:0;left:0;right:auto;width:2px;height:auto}
  .tabs .badge{position:static}
  .rail-mark{display:block;padding:0 28px 34px}
  .col{padding-bottom:0}
  .top{padding:16px 40px}
  .top .brand{display:none}
  .top-ctx{display:block;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--kasa-ink-3)}
  .status{padding:8px 40px}
  main{padding:36px 40px 48px}
  footer.foot{padding:20px 40px 28px}
  .filters{grid-template-columns:repeat(3,minmax(0,1fr)) minmax(0,1.4fr)}
  .filters .wide{grid-column:auto}
  .k td.first{min-width:220px;max-width:260px}
  .sheet{bottom:0}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="scrim" id="scrim" data-act="close"></div>

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fUSD(n,o){o=o||{};if(n==null||isNaN(n))return '–';var r=Math.round(n);if(r===0&&o.dash)return '–';var b=(o.dollar?'$':'')+Math.abs(r).toLocaleString('en-US');return r<0?'('+b+')':b}
function fNat(n){if(n==null||isNaN(n))return '–';var r=Math.round(n*100)/100;var b=Math.abs(r).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});return r<0?'('+b+')':b}
function fPct(n){if(n==null||!isFinite(n))return '–';var r=Math.round(n);return r<0?'('+(-r)+'%)':r+'%'}
function mLabel(m){return MON[+m.slice(5,7)-1]}
function mLong(m){return m?MON[+m.slice(5,7)-1]+' '+m.slice(0,4):''}
function mEnd(m,short){var y=+m.slice(0,4),mo=+m.slice(5,7);var d=new Date(Date.UTC(y,mo,0)).getUTCDate();return d+' '+MON[mo-1]+(short?'':' '+y)}
function dLong(s){return (+s.slice(8,10))+' '+MON[+s.slice(5,7)-1]+' '+s.slice(0,4)}
function dShort(s){return (+s.slice(8,10))+' '+MON[+s.slice(5,7)-1]}
function fx(c){return c==='USD'?1:(D.meta.fx[c]||0)}
function bal(a,m){return a.balances&&a.balances[m]!=null?a.balances[m]:null}
function sumUSD(l){return l.reduce(function(s,t){return s+t.usd},0)}
function sumNat(l){return l.reduce(function(s,t){return s+t.amount},0)}
function reg(fn){REG.push(fn);return REG.length-1}
function lastMonthOf(a){var k=Object.keys(a.balances||{}).sort();return k[k.length-1]}
function openQ(){return D.questions.filter(function(q){return q.status==='open'}).length}
function inRange(m,a,b){return m>=a&&m<=b}

/* ---------- data ---------- */
function load(){
  var cached=null;try{cached=JSON.parse(localStorage.getItem(CONFIG.cacheKey)||'null')}catch(e){}
  return fetch(CONFIG.dataUrl,{cache:'no-store',redirect:'follow'}).then(function(r){if(!r.ok)throw 0;return r.json()})
  .then(function(d){if(!d||!d.accounts||d.error)throw 0;try{localStorage.setItem(CONFIG.cacheKey,JSON.stringify(d))}catch(e){}return d})
  .catch(function(){if(cached&&cached.accounts)return cached;return JSON.parse(document.getElementById('kasa-data').textContent)});
}
function prepare(data){
  D=data;ACC={};TXBY={};
  D.accounts.forEach(function(a){ACC[a.id]=a});
  var ms={};D.accounts.forEach(function(a){Object.keys(a.balances||{}).forEach(function(k){ms[k]=1})});
  MONTHS=Object.keys(ms).sort();
  TX=D.transactions.slice().sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:(a.id<b.id?-1:a.id>b.id?1:0)});
  TX.forEach(function(t){TXBY[t.id]=t;t._m=t.date.slice(0,7);t._scope0=t.scope;t._cat0=t.category});
  BM=D.meta.booksCompleteTo.slice(0,7);
  var saved={};try{saved=JSON.parse(localStorage.getItem(CONFIG.answersKey)||'{}')}catch(e){}
  D.questions.forEach(function(q){if(saved[q.txId])applyAnswer(q,saved[q.txId],false)});
}
function applyAnswer(q,ans,persist){
  var t=TXBY[q.txId];if(!t)return;
  q.answer=ans;
  if(ans==null){q.status='open';t.scope=t._scope0;t.category=t._cat0}
  else{
    q.status='answered';
    var map={};ANSWERS.forEach(function(a){map[a[0]]=a[1]});
    t.scope=map[ans]||'question';
    t.category=ans==='Business income'?'Other income':ans==='Business cost'?'Other costs':t._cat0;
  }
  if(persist&&!DEMO){
    var saved={};try{saved=JSON.parse(localStorage.getItem(CONFIG.answersKey)||'{}')}catch(e){}
    if(ans==null)delete saved[q.txId];else saved[q.txId]=ans;
    localStorage.setItem(CONFIG.answersKey,JSON.stringify(saved));
  }
}

/* ---------- shell ---------- */
function statusText(){
  var r=new Date(D.meta.refreshed);
  var hh=String(r.getUTCHours()).padStart(2,'0'),mm=String(r.getUTCMinutes()).padStart(2,'0');
  return 'Books complete to '+dLong(D.meta.booksCompleteTo)+' · Refreshed '+r.getUTCDate()+' '+MON[r.getUTCMonth()]+', '+hh+':'+mm+' · USD';
}
function markHTML(){return '<div class="mark">KASA</div><span class="mark-who">Bibi Brzozka</span>'}
function render(){
  REG=[];
  var n=openQ();
  var tabs=PAGES.map(function(p){
    return '<button data-nav="'+p[0]+'"'+(S.page===p[0]?' aria-current="page"':'')+'>'+p[1]+(p[0]==='statements'&&n?'<span class="badge" title="Waiting on you">'+n+'</span>':'')+'</button>'
  }).join('');

   '<main id="main">'+body+'</main>'+
   '<footer class="foot"><span>Built by FirmNest</span><span>Kasa</span></footer></div></div>';

function go(p){S.page=p;if(!DEMO)history.replaceState(null,'','#'+p);render();window.scrollTo(0,0)}
function pageHead(eb,title,aside){return '<div class="ph"><div><div class="eyebrow">'+eb+'</div><h1>'+title+'</h1></div>'+(aside||'')+'</div>'}
function monthTh(m,cls){return '<th'+(cls?' class="'+cls+'"':'')+'>'+mLabel(m)+(m>BM?'<small>open</small>':'')+'</th>'}

/* ---------- Balances ---------- */
function pBalances(){
  var last=MONTHS[MONTHS.length-1],prev=MONTHS[MONTHS.length-2],usd=S.mode==='usd';
  var tot=function(m,accs){return (accs||D.accounts).reduce(function(s,a){return s+(bal(a,m)||0)*fx(a.ccy)},0)};
  var T=tot(last);
  var monthTx=TX.filter(function(t){return t._m===last});
  var aside='<div class="seg" role="group" aria-label="Monthly columns"><button data-act="mode" data-v="usd" aria-pressed="'+usd+'">Months in USD</button><button data-act="mode" data-v="native" aria-pressed="'+(!usd)+'">Native</button></div>';
  var rows='';
  var groups=GROUPS.concat(D.accounts.map(function(a){return a.group}).filter(function(g,i,arr){return GROUPS.indexOf(g)<0&&arr.indexOf(g)===i}));
  groups.forEach(function(g){
    var accs=D.accounts.filter(function(a){return a.group===g});if(!accs.length)return;
    var gl=TX.filter(function(t){return ACC[t.accountId].group===g});
    rows+='<tr class="grp"><td>'+g+'</td><td class="c-nat"></td><td class="num tap" data-d="'+reg(function(){drill(g,mLong(last),gl.filter(function(t){return t._m===last}))})+'">'+fUSD(tot(last,accs))+'</td>'+
      MONTHS.map(function(m){return usd?'<td class="num tap c-mon" data-d="'+reg(function(){drill(g,mLong(m),gl.filter(function(t){return t._m===m}))})+'">'+fUSD(tot(m,accs))+'</td>':'<td class="c-mon"></td>'}).join('')+'</tr>';
    accs.forEach(function(a){
      var b=bal(a,last),lm=lastMonthOf(a);
      rows+='<tr><td class="first"><button class="an" data-d="'+reg(function(){S.f={acc:a.id,month:'',scope:'',q:''};go('transactions')})+'">'+esc(a.kasaName)+'</button>'+
        (a.source==='manual'?'<span class="tag">manual'+(lm?' · as of '+mEnd(lm,true):' · no figure yet')+'</span>':'')+'</td>'+
        '<td class="num tap c-nat" data-d="'+reg(function(){drillAcc(a,last)})+'">'+fNat(b)+'<span class="ccy">'+a.ccy+'</span></td>'+
        '<td class="num tap" data-d="'+reg(function(){drillAcc(a,last)})+'">'+fUSD(b==null?null:b*fx(a.ccy))+'</td>'+
        MONTHS.map(function(m){var v=bal(a,m);return '<td class="num tap c-mon" data-d="'+reg(function(){drillAcc(a,m)})+'">'+(v==null?'–':usd?fUSD(v*fx(a.ccy)):fNat(v))+'</td>'}).join('')+'</tr>';
    });
  });
  rows+='<tr class="chg"><td class="first">Change since last month-end</td><td class="c-nat"></td><td class="num tap" data-d="'+reg(function(){drill('Change since '+mEnd(prev,true),mLong(last),monthTx)})+'">'+(prev?fUSD(T-tot(prev)):'–')+'</td>'+
    MONTHS.map(function(m,i){if(!usd)return '<td class="c-mon"></td>';if(!i)return '<td class="num c-mon">–</td>';return '<td class="num tap c-mon" data-d="'+reg(function(){drill('Change since '+mEnd(MONTHS[i-1],true),mLong(m),TX.filter(function(t){return t._m===m}))})+'">'+fUSD(tot(m)-tot(MONTHS[i-1]))+'</td>'}).join('')+'</tr>';
  rows+='<tr class="tot"><td class="first">Total</td><td class="c-nat"></td><td class="num tap" data-d="'+reg(function(){drill('All accounts',mLong(last),monthTx)})+'">'+fUSD(T)+'</td>'+
    MONTHS.map(function(m){return usd?'<td class="num tap c-mon" data-d="'+reg(function(){drill('All accounts',mLong(m),TX.filter(function(t){return t._m===m}))})+'">'+fUSD(tot(m))+'</td>':'<td class="c-mon"></td>'}).join('')+'</tr>';
  return pageHead('Every account, one place','Balances',aside)+
    '<div class="tw"><table class="k sticky bal mode-'+S.mode+'"><thead><tr><th>Account</th><th class="c-nat">Native</th><th>USD</th>'+MONTHS.map(function(m){return monthTh(m,'c-mon')}).join('')+'</tr></thead><tbody>'+rows+'</tbody></table></div>'+
    '<p class="note" style="margin-top:12px">Tap any number to see the transactions behind it.</p>';
}
function drillAcc(a,m){
  var l=TX.filter(function(t){return t.accountId===a.id&&t._m===m});
  drill(a.kasaName,mLong(m)+' · '+a.ccy,l,{empty:a.source==='manual'?'This balance comes from your manual Kasa sheet, so there are no transactions behind it yet.':'No transactions in this month.'});
}

/* ---------- Business ---------- */
function plData(){
  var biz=TX.filter(function(t){return t.scope==='business'});
  var cats={};biz.forEach(function(t){(cats[t.category]=cats[t.category]||[]).push(t)});
  var names=Object.keys(cats);
  var ord=function(list){return function(a,b){var ia=list.indexOf(a),ib=list.indexOf(b);ia=ia<0?99:ia;ib=ib<0?99:ib;return ia-ib||a.localeCompare(b)}};
  var inc=names.filter(function(n){return sumUSD(cats[n])>0}).sort(ord(INC_ORDER));
  var cost=names.filter(function(n){return sumUSD(cats[n])<=0}).sort(ord(COST_ORDER));
  return {biz:biz,cats:cats,inc:inc,cost:cost};
}
function pBusiness(){
  var P=plData(),cols=MONTHS.concat(['YTD']);
  var pick=function(l,m){return m==='YTD'?l:l.filter(function(t){return t._m===m})};
  var lab=function(m){return m==='YTD'?'Year to date':mLong(m)};
  var line=function(name,list,cls){
    return '<tr class="'+(cls||'')+'"><td class="first">'+name+'</td>'+cols.map(function(m){var l=pick(list,m);return '<td class="num tap" data-d="'+reg(function(){drill(name,lab(m)+' · US LLC',l)})+'">'+fUSD(sumUSD(l),{dash:true})+'</td>'}).join('')+'</tr>'};
  var allInc=[],allCost=[];
  var rows='<tr class="grp"><td colspan="'+(cols.length+1)+'">Income</td></tr>';
  P.inc.forEach(function(n){allInc=allInc.concat(P.cats[n]);rows+=line(n,P.cats[n])});
  rows+=line('Total income',allInc,'sub');
  rows+='<tr class="grp"><td colspan="'+(cols.length+1)+'">Costs</td></tr>';
  P.cost.forEach(function(n){allCost=allCost.concat(P.cats[n]);rows+=line(n,P.cats[n])});
  rows+=line('Total costs',allCost,'sub');
  rows+=line('Net profit',P.biz,'tot');
  rows+='<tr class="rate"><td class="first">Margin</td>'+cols.map(function(m){var i=sumUSD(pick(allInc,m));var l=pick(P.biz,m);return '<td class="num tap" data-d="'+reg(function(){drill('Net profit',lab(m)+' · US LLC',l)})+'">'+(i?fPct(sumUSD(l)/i*100):'–')+'</td>'}).join('')+'</tr>';
  return pageHead('US LLC · profit and loss','Business')+
    
    '<div class="tw"><table class="k sticky"><thead><tr><th>Line</th>'+MONTHS.map(monthTh).join('')+'<th>YTD</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}

/* ---------- Personal ---------- */
function pPersonal(){
  var pers=TX.filter(function(t){return t.scope==='personal'});
  var rows=MONTHS.map(function(m){var l=pers.filter(function(t){return t._m===m});
    return '<tr><td class="l">'+mLong(m)+(m>BM?' <span class="muted" style="font-size:11px">· open</span>':'')+'</td><td class="num tap" data-d="'+reg(function(){drill('To personal',mLong(m)+' · one bucket',l)})+'"><span class="muted">To personal:</span> '+fUSD(-sumUSD(l),{dollar:true})+'</td></tr>'}).join('');
  rows+='<tr class="tot"><td class="l">Year to date</td><td class="num tap" data-d="'+reg(function(){drill('To personal','Year to date',pers)})+'"><span class="muted">To personal:</span> '+fUSD(-sumUSD(pers),{dollar:true})+'</td></tr>';
  var fl=TX.filter(function(t){return t.scope==='transfer'&&t.transferTo});
  var flows='';
  MONTHS.slice().reverse().forEach(function(m){
    var l=fl.filter(function(t){return t._m===m}).reverse();if(!l.length)return;
    flows+='<tr class="grp"><td colspan="3">'+mLong(m)+' · '+l.length+' moves</td><td class="num">'+fUSD(-sumUSD(l))+' USD</td></tr>';
    l.forEach(function(t){
      flows+='<tr class="row-tap" data-tx="'+t.id+'"><td class="wrap">'+esc(ACC[t.accountId].kasaName)+'</td><td class="wrap">'+esc(ACC[t.transferTo]?ACC[t.transferTo].kasaName:t.transferTo)+'</td><td class="num">'+fNat(-t.amount)+'<span class="ccy">'+t.ccy+'</span></td><td class="num">'+dShort(t.date)+'</td></tr>';
    });
  });
  return pageHead('One bucket','Personal')+
    
    '<div class="tw"><table class="k"><thead><tr><th>Month</th><th>USD</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
    '<h2>Flows</h2>'+
    '<div class="tw"><table class="k"><thead><tr><th>From</th><th style="text-align:left">To</th><th>Amount</th><th>Date</th></tr></thead><tbody>'+(flows||'<tr><td colspan="4" class="l muted">No transfers yet.</td></tr>')+'</tbody></table></div>';
}

/* ---------- Property ---------- */
function propTx(country,cat){var cc=country==='Poland'?'PLN':'EUR';return TX.filter(function(t){return (t.scope==='property'||t.scope==='tax')&&t.ccy===cc&&(!cat||t.category===cat)})}
function pProperty(){
  var cols=MONTHS.concat(['YTD']);
  var pick=function(l,m){return m==='YTD'?l:l.filter(function(t){return t._m===m})};
  var lab=function(m){return m==='YTD'?'Year to date':mLong(m)};
  PROP={};['Poland','Portugal'].forEach(function(c){var ls={};propTx(c).forEach(function(t){ls[t.category]=1});var lines=Object.keys(ls).sort(function(a,b){var ia=PROP_ORDER.indexOf(a),ib=PROP_ORDER.indexOf(b);ia=ia<0?99:ia;ib=ib<0?99:ib;return ia-ib||a.localeCompare(b)});if(lines.length)PROP[c]={ccy:c==='Poland'?'PLN':'EUR',lines:lines}});
  var out=pageHead('Rents, Unitube and costs','Poland & Portugal');
  var usdRows='',allProp=[];
  Object.keys(PROP).forEach(function(c){
    var cfg=PROP[c],rows='',all=[];
    cfg.lines.forEach(function(n){var l=propTx(c,n);all=all.concat(l);
      rows+='<tr><td class="first">'+n+'</td>'+cols.map(function(m){var x=pick(l,m);return '<td class="num tap" data-d="'+reg(function(){drill(n+' · '+c,lab(m)+' · '+cfg.ccy,x)})+'">'+(x.length?fNat(sumNat(x)):'–')+'</td>'}).join('')+'</tr>'});
    rows+='<tr class="tot"><td class="first">Net · '+cfg.ccy+'</td>'+cols.map(function(m){var x=pick(all,m);return '<td class="num tap" data-d="'+reg(function(){drill('Net · '+c,lab(m),x)})+'">'+fNat(sumNat(x))+'</td>'}).join('')+'</tr>';
    rows+='<tr class="rate"><td class="first">Net · USD</td>'+cols.map(function(m){var x=pick(all,m);return '<td class="num tap" data-d="'+reg(function(){drill('Net · '+c,lab(m),x)})+'">'+fUSD(sumUSD(x))+'</td>'}).join('')+'</tr>';
    out+='<h2>'+c+' · '+cfg.ccy+'</h2><div class="tw"><table class="k sticky"><thead><tr><th>Line</th>'+MONTHS.map(monthTh).join('')+'<th>YTD</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
    usdRows+='<tr><td class="first">'+c+'</td>'+cols.map(function(m){var x=pick(all,m);return '<td class="num tap" data-d="'+reg(function(){drill('Net · '+c,lab(m),x)})+'">'+fUSD(sumUSD(x))+'</td>'}).join('')+'</tr>';
    allProp=allProp.concat(all);
  });
  usdRows+='<tr class="tot"><td class="first">Total · USD</td>'+cols.map(function(m){var x=pick(allProp,m);return '<td class="num tap" data-d="'+reg(function(){drill('All property',lab(m),x)})+'">'+fUSD(sumUSD(x))+'</td>'}).join('')+'</tr>';
  out+='<h2>Total in USD</h2><div class="tw"><table class="k sticky"><thead><tr><th>Country</th>'+MONTHS.map(monthTh).join('')+'<th>YTD</th></tr></thead><tbody>'+usdRows+'</tbody></table></div>';
  return out;
}

/* ---------- Statements ---------- */
function pStatements(){
  var ids={};D.statements.forEach(function(s){ids[s.accountId]=1});
  var accs=D.accounts.filter(function(a){return ids[a.id]});
  var map={},cnt={reconciled:0,received:0,missing:0};
  D.statements.forEach(function(s){map[s.accountId+'|'+s.month]=s;cnt[s.status]=(cnt[s.status]||0)+1});
  var rows=accs.map(function(a){
    return '<tr><td class="first">'+esc(a.kasaName)+'</td>'+MONTHS.map(function(m){
      var s=map[a.id+'|'+m];if(!s)return '<td class="st muted">–</td>';
      if(s.status==='missing')return '<td class="st st-miss"><b>Missing</b><span>Send '+esc(s.ask||'statement')+'</span></td>';
      var d=reg(function(){drillAcc(a,m)});
      return '<td class="st tap" data-d="'+d+'"><span class="st-in"><i class="sq'+(s.status==='reconciled'?' fill':'')+'"></i>'+(s.status==='reconciled'?'Reconciled':'Received')+'</span></td>';
    }).join('')+'</tr>';
  }).join('');
  var qs=D.questions.map(function(q){return {q:q,t:TXBY[q.txId]}}).filter(function(x){return x.t});
  var list=qs.map(function(x){
    var t=x.t,q=x.q,a=ACC[t.accountId];
    var act=q.status==='answered'
      ?'<div class="qdone">Saved as '+esc(q.answer)+' · <button class="link" data-act="undoq" data-id="'+t.id+'">Change</button></div>'
      :'<div class="qact"><select data-q="'+t.id+'" aria-label="What is this?"><option value="">What is this?</option>'+ANSWERS.map(function(o){return '<option>'+o[0]+'</option>'}).join('')+'</select><button class="btn-save" data-act="saveq" data-id="'+t.id+'">Save</button></div>';
    return '<li><div class="qtop"><span>'+dShort(t.date)+' · '+esc(a.kasaName)+'</span><button class="qamt num" data-tx="'+t.id+'">'+fNat(t.amount)+'<span class="ccy">'+t.ccy+'</span></button></div>'+
      '<div class="qdesc">'+esc(t.contact)+(t.description?' — '+esc(t.description):'')+'</div>'+act+'</li>';
  }).join('');
  return pageHead('What we have, what we need','Statements')+
    '<div class="legend"><span><i class="sq fill"></i>Reconciled '+cnt.reconciled+'</span><span><i class="sq"></i>Received '+cnt.received+'</span><span class="wait">Missing '+cnt.missing+'</span></div>'+
    '<div class="tw"><table class="k sticky"><thead><tr><th>Account</th>'+MONTHS.map(monthTh).join('')+'</tr></thead><tbody>'+rows+'</tbody></table></div>'+
    '<h2>Unexplained ('+openQ()+')</h2><ul class="ql">'+(list||'<li class="muted">Nothing waiting on you.</li>')+'</ul>';
}

/* ---------- Transactions ---------- */
function pTransactions(){
  var f=S.f;
  var opt=function(v,l,sel){return '<option value="'+esc(v)+'"'+(sel?' selected':'')+'>'+esc(l)+'</option>'};
  var accO=opt('','All accounts',!f.acc)+GROUPS.map(function(g){var a=D.accounts.filter(function(x){return x.group===g});return a.length?'<optgroup label="'+g+'">'+a.map(function(x){return opt(x.id,x.kasaName,f.acc===x.id)}).join('')+'</optgroup>':''}).join('');
  var monO=opt('','All months',!f.month)+MONTHS.map(function(m){return opt(m,mLong(m),f.month===m)}).join('');
  var scO=opt('','Everything',!f.scope)+Object.keys(SCOPES).map(function(k){return opt(k,SCOPES[k],f.scope===k)}).join('');
  return pageHead('Full ledger','Transactions')+
    '<div class="filters"><label><span>Account</span><select data-f="acc">'+accO+'</select></label><label><span>Month</span><select data-f="month">'+monO+'</select></label>'+
    '<label><span>Type</span><select data-f="scope">'+scO+'</select></label><label class="wide"><span>Search</span><input class="input" data-f="q" type="search" placeholder="Name, description, amount" value="'+esc(f.q)+'"></label></div>'+
    '<div id="txres"></div>';
}
function txFiltered(){
  var f=S.f,q=f.q.trim().toLowerCase();
  return TX.filter(function(t){
    if(f.acc&&t.accountId!==f.acc)return false;
    if(f.month&&t._m!==f.month)return false;
    if(f.scope&&t.scope!==f.scope)return false;
    if(q){var h=(t.contact+' '+t.description+' '+(ACC[t.accountId]||{}).kasaName+' '+t.category+' '+fNat(t.amount)+' '+t.amount).toLowerCase();if(h.indexOf(q)<0)return false}
    return true;
  });
}
function renderTxRes(){
  var el=$('#txres');if(!el)return;
  var f=S.f,L=txFiltered().slice().reverse(),a=f.acc?ACC[f.acc]:null;
  var shown=L.slice(0,S.lim);
  var rows=shown.map(function(t){
    var ac=ACC[t.accountId];
    return '<tr class="row-tap" data-tx="'+t.id+'"><td class="l">'+dShort(t.date)+'</td><td class="wrap" style="min-width:170px;max-width:240px"><div class="d1">'+esc(t.contact)+'</div><div class="d2">'+esc(t.description)+(a?'':' · '+esc(ac.kasaName))+'</div></td>'+
      '<td class="l'+(t.scope==='question'?' wait':'')+'" style="font-size:12px">'+SCOPES[t.scope]+'</td>'+
      '<td class="num">'+fNat(t.amount)+'<span class="ccy">'+t.ccy+'</span></td><td class="num">'+fUSD(t.usd)+'</td>'+
      (a?'<td class="num">'+fNat(t.balanceAfter)+'</td>':'')+'</tr>';
  }).join('');
  var line='<div class="resline"><span>'+L.length+' transactions'+(a?' · running balance in '+a.ccy:'')+'</span><span class="num">Total '+(a?fNat(sumNat(L))+' '+a.ccy+' · ':'')+fUSD(sumUSD(L))+' USD</span></div>';
  el.innerHTML=line+'<div class="tw"><table class="k sticky"><thead><tr><th>Date</th><th style="text-align:left">Description</th><th style="text-align:left">Type</th><th>Amount</th><th>USD</th>'+(a?'<th>Balance</th>':'')+'</tr></thead><tbody>'+
    (rows||'<tr><td colspan="6" class="l muted">No transactions match.</td></tr>')+'</tbody></table></div>'+
    (L.length>S.lim?'<button class="more" data-act="more">Show '+Math.min(150,L.length-S.lim)+' more</button>':'');
}

/* ---------- Sheet ---------- */
function drill(title,sub,list,opts){S.stack=[{type:'drill',title:title,sub:sub,list:list,q:'',opts:opts||{}}];openSheet()}
function topView(){return S.stack[S.stack.length-1]}
function openSheet(){
  renderSheet();
  var sh=$('#sheet');
  $('#scrim').classList.add('on');document.body.style.overflow='hidden';
  sh.setAttribute('aria-hidden','false');
  if(Q.has('open')&&!openSheet.booted){sh.style.transition='none';openSheet.booted=true}else sh.style.transition='';
  void sh.offsetHeight;
  sh.classList.add('on');
}
function closeSheet(){
  var sh=$('#sheet');sh.classList.remove('on');sh.setAttribute('aria-hidden','true');
  $('#scrim').classList.remove('on');document.body.style.overflow='';S.stack=[];
}
function head(eb,title,sub){
  var back=S.stack.length>1?'<button class="sh-x" data-act="back">Back</button>':'';
  return '<div class="sh-h"><div class="grab"></div><div class="sh-top"><div style="min-width:0">'+(back?'<div style="margin:-6px 0 2px">'+back+'</div>':'')+'<div class="eyebrow">'+eb+'</div><div class="sh-title">'+title+'</div>'+(sub?'<div class="sh-sub">'+sub+'</div>':'')+'</div><button class="sh-x" data-act="close">Close</button></div>';
}
function renderSheet(){
  var v=topView(),sh=$('#sheet');if(!v)return;
  if(v.type==='drill'){
    sh.innerHTML=head('Behind this number',esc(v.title),esc(v.sub))+'<input id="sh-q" class="input sh-search" type="search" placeholder="Search these transactions" value="'+esc(v.q)+'"></div><div class="sh-b" id="sh-list"></div><div class="sh-f" id="sh-foot"></div>';
    renderDrillList();
  }else if(v.type==='tx'){
    sh.innerHTML=vDetail(v.id);
    var row=sh.querySelector('.kr-row'),hit=sh.querySelector('.kr-row .hit');
    if(row&&hit)row.scrollLeft=Math.max(0,hit.offsetLeft-160);
  }else if(v.type==='accountant'){
    sh.innerHTML=vAccountant();
  }
}
function renderDrillList(){
  var v=topView();var q=v.q.trim().toLowerCase();
  var L=v.list.filter(function(t){return !q||(t.contact+' '+t.description+' '+ACC[t.accountId].kasaName+' '+t.amount+' '+fNat(t.amount)).toLowerCase().indexOf(q)>=0});
  var html=L.length?'<div class="dh"><span>Date</span><span>Description</span><span>Amount</span></div>'+L.map(function(t){
    return '<button class="dr" data-tx="'+t.id+'"><span class="dt num">'+dShort(t.date)+'</span><span style="min-width:0"><span class="d1" style="display:block">'+esc(t.contact)+'</span><span class="d2" style="display:block">'+esc(ACC[t.accountId].kasaName)+' · '+esc(t.description)+'</span></span><span class="am num"><span class="n" style="display:block">'+fNat(t.amount)+'<span class="ccy">'+t.ccy+'</span></span><span class="u" style="display:block">'+fUSD(t.usd)+' USD</span></span></button>'}).join('')
    :'<div class="empty">'+(q?'Nothing matches “'+esc(v.q)+'”.':esc(v.opts.empty||'No transactions behind this number.'))+'</div>';
  $('#sh-list').innerHTML=html;
  var ccys={};L.forEach(function(t){ccys[t.ccy]=1});var one=Object.keys(ccys).length===1?Object.keys(ccys)[0]:null;
  $('#sh-foot').innerHTML='<span>Total <span class="muted">· '+L.length+' transaction'+(L.length===1?'':'s')+'</span></span><span class="num">'+(one&&one!=='USD'?fNat(sumNat(L))+' '+one+' · ':'')+fUSD(sumUSD(L),{dollar:true})+'</span>';
}
function sentence(t){
  var a=ACC[t.accountId],amt=fNat(Math.abs(t.amount))+' '+t.ccy,d=t.description?t.description.charAt(0).toLowerCase()+t.description.slice(1):'';
  if(t.scope==='transfer'&&t.transferTo)return 'You moved '+amt+' from '+a.kasaName+' to '+(ACC[t.transferTo]?ACC[t.transferTo].kasaName:'another account')+'.';
  if(t.scope==='transfer')return amt+' arrived in '+a.kasaName+' from '+t.contact+', another of your accounts.';
  if(t.scope==='question')return 'Money '+(t.amount>0?'came into ':'left ')+a.kasaName+(t.amount>0?' from ':' to ')+t.contact+', and we don’t yet know what it was.';
  if(t.scope==='personal')return 'You spent '+amt+' at '+t.contact+' from '+a.kasaName+'.';
  return t.amount>0?t.contact+' paid '+amt+' into '+a.kasaName+(d?' — '+d:'')+'.':'You paid '+t.contact+' '+amt+' from '+a.kasaName+(d?' — '+d:'')+'.';
}
function vDetail(id){
  var t=TXBY[id],a=ACC[t.accountId];
  var q=D.questions.filter(function(x){return x.txId===id})[0];
  var cell=function(lb,v,s,cls){return '<div class="cell '+(cls||'')+'"><div class="lb">'+lb+'</div><div class="v'+(cls&&cls.indexOf('n')>=0?' num':'')+'">'+v+'</div>'+(s?'<div class="s">'+s+'</div>':'')+'</div>'};
  var kr='<div class="kr-row"><table><thead><tr><th>Account</th>'+MONTHS.map(function(m){return '<th>'+mLabel(m)+'</th>'}).join('')+'</tr></thead><tbody><tr><td>'+esc(a.kasaName)+'</td>'+
    MONTHS.map(function(m){return '<td'+(m===t._m?' class="hit"':'')+'>'+fNat(bal(a,m))+'</td>'}).join('')+'</tr></tbody></table></div>';
  var rate=t.ccy==='USD'?'USD account':'1 '+t.ccy+' = '+Number(t.rate).toFixed(4)+' USD';
  var type=SCOPES[t.scope]+(t.category&&t.scope!=='personal'&&t.scope!=='transfer'?' · '+esc(t.category):'');
  var html=head('Transaction',esc(t.contact),dLong(t.date)+' · '+esc(a.kasaName))+'</div><div class="sh-b">'+
    '<div class="kr-head"><div class="eyebrow">Kasa row</div><div class="kr-name">'+esc(a.kasaName)+' · '+mLong(t._m)+'</div></div>'+kr+
    '<div class="kr-cap">Month-end balances · '+a.ccy+'</div>'+
    '<div class="cells">'+
      cell('Account',esc(a.kasaName),esc(a.country)+' · '+a.ccy)+cell('Month column',mLong(t._m),'Date '+dLong(t.date))+
      cell('Amount · '+t.ccy,fNat(t.amount),null,'n')+cell('Amount · USD',fUSD(t.usd),rate,'n')+
      cell('What it is',esc(sentence(t)),null,'w say')+
      cell('Type',type,null,t.scope==='question'?'waiting':'')+cell('Counterparty',esc(t.contact),null)+
      (t.transferTo?cell('Moved to',esc(ACC[t.transferTo]?ACC[t.transferTo].kasaName:t.transferTo),null,'w'):'')+
      cell('Balance after',fNat(t.balanceAfter)+'<span class="ccy">'+t.ccy+'</span>',null,'n')+cell('Code · source',esc(t.code||'–'),a.source==='manual'?'Your manual sheet':'From your books')+
      (q&&q.status==='open'?'<div class="cell w waiting"><div class="lb">Waiting on you</div><div class="v">Tell us what this is. <button class="link" data-act="toq">Answer in Statements</button></div></div>':'')+
    '</div><div class="kr-cap" style="margin-bottom:20px">Kasa row: '+esc(a.kasaName)+' · '+mLong(t._m)+' · ref '+esc(t.id)+'</div></div>';
  return html;
}

/* ---------- Accountant ---------- */
function presets(){
  var y=MONTHS[0].slice(0,4),first=MONTHS[0],last=MONTHS[MONTHS.length-1];
  return [['To books close',first,BM],['Q1',y+'-01',y+'-03'],['Q2',y+'-04',y+'-06'],['Q3',y+'-07',y+'-09'],['Year to date',first,last]].filter(function(p){return p[1]<=last});
}
function vAccountant(){
  if(!S.ap.from){S.ap.from=MONTHS[0];S.ap.to=BM}
  var a=S.ap;
  var opts=function(sel){return MONTHS.map(function(m){return '<option value="'+m+'"'+(m===sel?' selected':'')+'>'+mLong(m)+'</option>'}).join('')};
  var P=plData();var inP=function(t){return inRange(t._m,a.from,a.to)};
  var biz=P.biz.filter(inP),all=TX.filter(inP);
  var inc=biz.filter(function(t){return t.amount>0});
  return head('For your accountant','Download for your accountant','')+'</div><div class="sh-b" style="padding-top:16px">'+
    '<div class="eyebrow">Period</div><div class="chips">'+presets().map(function(p,i){return '<button class="chip" data-act="preset" data-i="'+i+'" aria-pressed="'+(p[1]===a.from&&p[2]===a.to)+'">'+p[0]+'</button>'}).join('')+'</div>'+
    '<div class="two"><label><span>From</span><select data-ap="from">'+opts(a.from)+'</select></label><label><span>To</span><select data-ap="to">'+opts(a.to)+'</select></label></div>'+
    '<div class="acc-sum"><div><span>Income</span><span class="num">'+fUSD(sumUSD(inc),{dollar:true})+'</span></div><div><span>Net profit</span><span class="num">'+fUSD(sumUSD(biz),{dollar:true})+'</span></div><div><span>Transactions</span><span class="num">'+all.length+'</span></div></div>'+
    (a.to>BM?'<p class="note" style="margin-bottom:14px">Months after '+dLong(D.meta.booksCompleteTo)+' are not closed yet.</p>':'')+
    (a.from>a.to?'<p class="note wait" style="margin-bottom:14px">The start month is after the end month.</p>':'')+
    '<button class="btn-solid" data-act="download"'+(a.from>a.to?' disabled':'')+'>Download P&amp;L and transactions</button><div style="height:20px"></div></div>';
}
function csv(rows){return rows.map(function(r){return r.map(function(v){var s=v==null?'':String(v);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}).join(',')}).join('\r\n')}
function save(name,text){var b=new Blob(['\ufeff'+text],{type:'text/csv;charset=utf-8'});var u=URL.createObjectURL(b);var l=document.createElement('a');l.href=u;l.download=name;document.body.appendChild(l);l.click();l.remove();setTimeout(function(){URL.revokeObjectURL(u)},2000)}
function download(){
  var a=S.ap,ms=MONTHS.filter(function(m){return inRange(m,a.from,a.to)}),P=plData();
  var r2=function(n){return Math.round(n*100)/100};
  var rows=[['Line'].concat(ms.map(mLong),['Total'])];
  var line=function(n,l){rows.push([n].concat(ms.map(function(m){return r2(sumUSD(l.filter(function(t){return t._m===m})))}),[r2(sumUSD(l.filter(function(t){return inRange(t._m,a.from,a.to)})))]))};
  var inc=[],cost=[];
  rows.push(['Income']);P.inc.forEach(function(n){inc=inc.concat(P.cats[n]);line(n,P.cats[n])});line('Total income',inc);
  rows.push(['Costs']);P.cost.forEach(function(n){cost=cost.concat(P.cats[n]);line(n,P.cats[n])});line('Total costs',cost);
  line('Net profit',P.biz);
  var tag=a.from+'_'+a.to;
  save('kasa-pl-'+tag+'.csv',csv(rows));
  var tr=[['id','date','month','account_id','kasa_name','ccy','amount','usd','fx_rate','scope','category','code','contact','description','transfer_to','balance_after']];
  TX.filter(function(t){return inRange(t._m,a.from,a.to)}).forEach(function(t){tr.push([t.id,t.date,t._m,t.accountId,ACC[t.accountId].kasaName,t.ccy,t.amount,t.usd,t.rate,t.scope,t.category,t.code,t.contact,t.description,t.transferTo?ACC[t.transferTo].kasaName:'',t.balanceAfter])});
  setTimeout(function(){save('kasa-transactions-'+tag+'.csv',csv(tr))},400);
}

/* ---------- PIN ---------- */
function showPin(){
  var entered='',el=$('#pin');
  var draw=function(err){
    el.innerHTML='<div class="pin" role="dialog" aria-label="Enter PIN"><div class="pin-in"><div class="mark">KASA</div><span class="mark-who" style="margin-top:12px">Bibi Brzozka</span>'+
      '<div class="pin-msg">Enter your PIN</div><div class="dots">'+[0,1,2,3].map(function(i){return '<i class="'+(i<entered.length?'on':'')+'"></i>'}).join('')+'</div>'+
      '<div class="pin-err" role="alert">'+(err||'')+'</div><div class="pad">'+[1,2,3,4,5,6,7,8,9].map(function(n){return '<button data-k="'+n+'">'+n+'</button>'}).join('')+
      '<span></span><button data-k="0">0</button><button class="txt" data-k="del">Delete</button></div><p class="pin-note">Asked once. Kasa remembers this device.</p></div></div>';
  };
  var press=function(k){
    if(k==='del'){entered=entered.slice(0,-1);return draw()}
    if(entered.length>=4)return;entered+=k;draw();
    if(entered.length===4)setTimeout(function(){
      if(entered===CONFIG.pin){if(!DEMO)localStorage.setItem(CONFIG.deviceKey,'ok');el.innerHTML='';document.removeEventListener('keydown',kd)}
      else{entered='';draw('That PIN didn’t match. Try again.')}
    },120);
  };
  var kd=function(e){if(/^[0-9]$/.test(e.key))press(e.key);else if(e.key==='Backspace')press('del')};
  el.onclick=function(e){var b=e.target.closest('[data-k]');if(b)press(b.dataset.k)};
  document.addEventListener('keydown',kd);
  draw();
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-d],[data-tx],[data-nav],[data-act]');if(!t)return;
  if(t.dataset.d!=null){REG[+t.dataset.d]&&REG[+t.dataset.d]();return}
  if(t.dataset.tx){var inSheet=!!t.closest('#sheet');if(inSheet&&topView()){S.stack.push({type:'tx',id:t.dataset.tx});renderSheet();$('#sheet .sh-b')&&($('#sheet .sh-b').scrollTop=0)}else{S.stack=[{type:'tx',id:t.dataset.tx}];openSheet()}return}
  if(t.dataset.nav){go(t.dataset.nav);return}
  var act=t.dataset.act;
  if(act==='close')closeSheet();
  else if(act==='back'){S.stack.pop();renderSheet()}
  else if(act==='mode'){S.mode=t.dataset.v;render()}
  else if(act==='more'){S.lim+=150;renderTxRes()}
  else if(act==='accountant'){S.stack=[{type:'accountant'}];openSheet()}
  else if(act==='preset'){var p=presets()[+t.dataset.i];S.ap.from=p[1];S.ap.to=p[2];renderSheet()}
  else if(act==='download')download();
  else if(act==='toq'){closeSheet();go('statements')}
  else if(act==='saveq'){
    var sel=document.querySelector('select[data-q="'+t.dataset.id+'"]');
    if(!sel||!sel.value){sel&&sel.focus();return}
    var q=D.questions.filter(function(x){return x.txId===t.dataset.id})[0];applyAnswer(q,sel.value,true);render();
  }
  else if(act==='undoq'){var q2=D.questions.filter(function(x){return x.txId===t.dataset.id})[0];applyAnswer(q2,null,true);render()}
});
document.addEventListener('change',function(e){
  var el=e.target;
  if(el.dataset.f&&el.dataset.f!=='q'){S.f[el.dataset.f]=el.value;S.lim=150;renderTxRes()}
  if(el.dataset.ap){S.ap[el.dataset.ap]=el.value;renderSheet()}
});
document.addEventListener('input',function(e){
  var el=e.target;
  if(el.dataset.f==='q'){S.f.q=el.value;S.lim=150;renderTxRes()}
  if(el.id==='sh-q'){topView().q=el.value;renderDrillList()}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&S.stack.length)closeSheet()});
window.addEventListener('hashchange',function(){var h=location.hash.slice(1);if(h&&h!==S.page&&PAGES.some(function(p){return p[0]===h}))go(h)});

/* ---------- boot ---------- */
load().then(function(data){
  prepare(data);
  var p=Q.get('page')||location.hash.slice(1);
  if(PAGES.some(function(x){return x[0]===p}))S.page=p;
  if(Q.get('acc'))S.f.acc=Q.get('acc');
  if(Q.get('month'))S.f.month=Q.get('month');
  if(Q.get('months')==='native')S.mode='native';
  render();
  var o=Q.get('open');
  if(o==='detail'||o==='drilldetail'){
    var t=TX.filter(function(x){return x.category==='Unitube remuneration'&&x._m===BM})[0]||TX[0];
    if(o==='drilldetail'){var l=TX.filter(function(x){return x.accountId===t.accountId&&x._m===BM});S.stack=[{type:'drill',title:ACC[t.accountId].kasaName,sub:mLong(BM),list:l,q:'',opts:{}},{type:'tx',id:t.id}]}
    else S.stack=[{type:'tx',id:t.id}];
    openSheet();
  }else if(o==='drill'){
    drill('Total income',mLong(BM)+' · US LLC',TX.filter(function(x){return x.scope==='business'&&x.amount>0&&x._m===BM}));
  }else if(o==='accountant'){S.stack=[{type:'accountant'}];openSheet()}
  if(Q.get('pin')==='1'||(!DEMO&&localStorage.getItem(CONFIG.deviceKey)!=='ok'))showPin();
});
})();
</script>
